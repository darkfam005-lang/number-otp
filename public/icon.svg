<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Background with squircle corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer subtle pulse ring -->
  <circle cx="256" cy="240" r="170" fill="none" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="4"/>
  <circle cx="256" cy="240" r="140" fill="none" stroke="#6366f1" stroke-opacity="0.25" stroke-width="3" stroke-dasharray="10 10"/>

  <!-- Chat / SMS Bubble Shape -->
  <g filter="url(#shadow)">
    <path d="M140 160 C140 126.86 166.86 100 200 100 L312 100 C345.14 100 372 126.86 372 160 L372 270 C372 303.14 345.14 330 312 330 L230 330 L160 380 L175 330 C154.5 325 140 304 140 270 Z" fill="url(#glow)"/>
  </g>

  <!-- Antenna / Signal Waves on top -->
  <path d="M226 170 C240 156 272 156 286 170" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <path d="M206 146 C232 126 280 126 306 146" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="10" stroke-linecap="round"/>

  <!-- Fast lightning / message routing icon inside -->
  <path d="M266 195 L225 255 L255 255 L245 295 L287 235 L257 235 Z" fill="#ffffff"/>

  <!-- Lamix Brand Badge -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="46" fill="#38bdf8" text-anchor="middle" letter-spacing="4">LAMIX</text>
  <text x="256" y="475" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="18" fill="#94a3b8" text-anchor="middle" letter-spacing="3">SMS GATEWAY</text>
</svg>
